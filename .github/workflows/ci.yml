name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - "release/**"
      - main
  push:
    branches:
      - develop
      - "release/**"
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, build and container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test with full source coverage gate
        run: npm run test:coverage

      - name: Repeat test suite twice to detect flakiness
        run: |
          npm test
          npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E and accessibility
        run: npm run test:e2e

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-e2e-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Build container without publishing
        run: docker build --tag desarrolloappsii-front:${{ github.sha }} .
